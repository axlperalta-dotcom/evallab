<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3ed" />
    <title>EvalLab — Respuestas bajo la lupa</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Ir al contenido</a>
    <header class="masthead">
      <a class="brand" href="/" aria-label="EvalLab, inicio"
        ><span class="brand-icon" aria-hidden="true">e/</span>EvalLab<span
          class="edition"
          >LABORATORIO DE RESPUESTAS</span
        ></a
      >
      <span class="local-label"
        ><span class="status-dot"></span>Guardado local</span
      >
    </header>
    <div class="navigation-bar">
      <nav aria-label="Navegación principal">
        <button data-action="nav" data-view="cases" aria-current="page">
          Casos <span id="case-count" class="nav-count"></span>
        </button>
        <button data-action="nav" data-view="runs">
          Ejecuciones <span id="run-count" class="nav-count"></span>
        </button>
        <button data-action="nav" data-view="compare">Comparar</button>
        <button data-action="nav" data-view="guide">Guía</button>
      </nav>
      <span class="navigation-note">Observa. Comprueba. Cuestiona.</span>
    </div>
    <main id="main" tabindex="-1">
      <p class="loading">Cargando tu laboratorio…</p>
    </main>
    <footer class="page-footer">
      <span>EvalLab / <span id="breadcrumb">Casos</span></span
      ><span>Respuestas escritas a mano · Sin conexión a modelos</span>
    </footer>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <button class="close" data-action="close" aria-label="Cerrar">×</button>
      <div id="dialog-content"></div>
      <p id="form-error" class="alert error" role="alert" hidden></p>
    </dialog>
    <div id="toast" role="status" class="toast" hidden></div>
  </body>
</html>
